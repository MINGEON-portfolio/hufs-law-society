<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 | 외대법학회</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="styles.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .nf-emblem{width:88px;height:88px;border-radius:50%;margin:0 auto 28px;box-shadow:0 8px 24px rgba(20,44,70,.22);}
  .nf-code{font-size:13px;font-weight:700;letter-spacing:.24em;color:var(--gold);margin:0 0 14px;}
  .nf-title{font-size:clamp(22px,4vw,28px);margin:0 0 12px;}
  .nf-desc{color:var(--muted);font-size:15px;margin:0 0 30px;}
</style>
</head>
<body>
  <div>
    <img class="nf-emblem" src="assets/logo.png" alt="외대법학회 엠블럼">
    <p class="nf-code">404 NOT FOUND</p>
    <h1 class="nf-title">페이지를 찾을 수 없습니다</h1>
    <p class="nf-desc">주소가 바뀌었거나 삭제된 페이지일 수 있어요.</p>
    <a href="/" class="btn btn-primary" style="background:var(--navy);color:#fff;display:inline-flex;">홈으로 돌아가기</a>
  </div>
</body>
</html>
